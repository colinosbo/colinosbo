<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-label="Terminal typing whoami for Colin Osborn">
  <defs>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ce03c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3ce03c" stop-opacity=".07"/>
      <stop offset="1" stop-color="#3ce03c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
    <clipPath id="screen"><rect x="1" y="37" width="898" height="390" rx="7"/></clipPath>
  </defs>
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace; font-size: 15px; fill: #cccccc; white-space: pre; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
    .ok   { fill: #16c60c; font-weight: bold; }
    .info { fill: #f9f1a5; font-weight: bold; }
    .val  { fill: #3ce03c; }
    .dot  { fill: #4a4a4a; }
    .done { fill: #61d6d6; font-weight: bold; }
    .cmd  { fill: #ffffff; }
    .cur  { fill: #3ce03c; }
    .a    { opacity: 0; animation: on .01s linear forwards; }
    .blink { animation: blink 1s steps(1) infinite; }
    .sweep { animation: sweep 6s linear infinite; }
    .boot  { animation: boot .6s ease-out both; transform-origin: 450px 214.0px; }
    @keyframes on    { to { opacity: 1; } }
    @keyframes gone  { to { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes type  { from { transform: translateX(0); } to { transform: translateX(var(--d)); } }
    @keyframes sweep { from { transform: translateY(-120px); } to { transform: translateY(428px); } }
    @keyframes boot  { 0% { opacity: 0; transform: scaleY(.02); } 60% { opacity: 1; transform: scaleY(1.02); } 100% { transform: scaleY(1); } }
  </style>

  <g class="boot">
  <rect x="0.5" y="0.5" width="899" height="427" rx="8" fill="#0c0c0c" stroke="#3a3a3a"/>
  <path d="M8.5 0.5 H891.5 A8 8 0 0 1 899.5 8.5 V36 H0.5 V8.5 A8 8 0 0 1 8.5 0.5 Z" fill="#1f1f1f"/>
  <rect x="16" y="12" width="14" height="12" rx="2" fill="none" stroke="#cccccc"/>
  <path d="M19 16 l3 2 -3 2" fill="none" stroke="#cccccc"/>
  <text class="title" x="40" y="23">C:\WINDOWS\system32\cmd.exe</text>
  <path d="M790 18 h12" stroke="#cccccc"/>
  <rect x="830" y="12" width="11" height="11" fill="none" stroke="#cccccc"/>
  <path d="M868 12 l11 11 M879 12 l-11 11" stroke="#cccccc"/>

  <g filter="url(#glow)">
    <text x="24" y="72" textLength="226.8" lengthAdjust="spacing">Colinosbo [Version 2026.11]</text>
    <text x="24" y="96" textLength="436.8" lengthAdjust="spacing">(c) Colin Osborn. Security engineering &amp; agentic AI.</text>
    <g class="a" style="animation-delay:2.89s"><text x="24" y="144" textLength="176.4" lengthAdjust="spacing">C:\Users\colin&gt;<tspan class="cmd">whoami</tspan></text></g>
    <text x="24" y="168" textLength="302.4" lengthAdjust="spacing"><tspan class="ok">[ OK ]</tspan> name <tspan class="dot">...........</tspan> <tspan class="val">Colin Osborn</tspan></text>
    <text x="24" y="192" textLength="571.2" lengthAdjust="spacing"><tspan class="ok">[ OK ]</tspan> role <tspan class="dot">...........</tspan> <tspan class="val">Security Analyst @ CCC Intelligent Solutions</tspan></text>
    <text x="24" y="216" textLength="579.6" lengthAdjust="spacing"><tspan class="ok">[ OK ]</tspan> education <tspan class="dot">......</tspan> <tspan class="val">B.S. Cybersecurity, Illinois State University</tspan></text>
    <text x="24" y="240" textLength="344.4" lengthAdjust="spacing"><tspan class="ok">[ OK ]</tspan> certs <tspan class="dot">..........</tspan> <tspan class="val">CompTIA Security+</tspan></text>
    <text x="24" y="264" textLength="478.8" lengthAdjust="spacing"><tspan class="info">[INFO]</tspan> focus <tspan class="dot">..........</tspan> <tspan class="val">Security engineering · Agentic AI</tspan></text>
    <text x="24" y="288" textLength="579.6" lengthAdjust="spacing"><tspan class="ok">[ OK ]</tspan> win <tspan class="dot">............</tspan> <tspan class="val">DRP backlog 3,500 → &lt;10 with AI triage agents</tspan></text>
    <text x="24" y="336" textLength="378.0" lengthAdjust="spacing"><tspan class="done">=== Done ===</tspan>  linkedin.com/in/colinosborn2002</text>
    <g class="a" style="animation-delay:12.26s"><text x="24" y="384" textLength="126.0" lengthAdjust="spacing">C:\Users\colin&gt;</text><rect x="150.0" y="370" width="8.4" height="18" class="cur blink"/></g>
  </g>
  <g>
    <g class="cv" style="--d:226.8px;animation:type 0.945s steps(27) 0.400s both,gone .01s linear 1.425s forwards"><rect x="24.0" y="55" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:0.400s"><rect x="24.0" y="58" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:436.8px;animation:type 1.300s steps(52) 1.465s both,gone .01s linear 2.845s forwards"><rect x="24.0" y="79" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:1.465s"><rect x="24.0" y="82" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:50.4px;animation:type 0.840s steps(6) 3.785s both,gone .01s linear 4.705s forwards"><rect x="150.0" y="127" width="748.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:2.885s"><rect x="150.0" y="130" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:302.4px;animation:type 0.576s steps(36) 5.075s both,gone .01s linear 5.731s forwards"><rect x="24.0" y="151" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:5.075s"><rect x="24.0" y="154" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:571.2px;animation:type 1.088s steps(68) 5.771s both,gone .01s linear 6.939s forwards"><rect x="24.0" y="175" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:5.771s"><rect x="24.0" y="178" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:579.6px;animation:type 1.104s steps(69) 6.979s both,gone .01s linear 8.163s forwards"><rect x="24.0" y="199" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:6.979s"><rect x="24.0" y="202" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:344.4px;animation:type 0.656s steps(41) 8.203s both,gone .01s linear 8.939s forwards"><rect x="24.0" y="223" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:8.203s"><rect x="24.0" y="226" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:478.8px;animation:type 0.912s steps(57) 8.979s both,gone .01s linear 9.971s forwards"><rect x="24.0" y="247" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:8.979s"><rect x="24.0" y="250" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:579.6px;animation:type 1.104s steps(69) 10.011s both,gone .01s linear 11.195s forwards"><rect x="24.0" y="271" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:10.011s"><rect x="24.0" y="274" width="8.4" height="18" class="cur blink"/></g></g>
    <g class="cv" style="--d:378.0px;animation:type 0.900s steps(45) 11.235s both,gone .01s linear 12.215s forwards"><rect x="24.0" y="319" width="874.0" height="24" fill="#0c0c0c"/><g class="a" style="animation-delay:11.235s"><rect x="24.0" y="322" width="8.4" height="18" class="cur blink"/></g></g>
  </g>

  <g clip-path="url(#screen)" pointer-events="none">
    <rect x="0" y="37" width="900" height="391" fill="url(#lines)"/>
    <rect class="sweep" x="0" y="0" width="900" height="120" fill="url(#scan)"/>
  </g>
  </g>
</svg>
