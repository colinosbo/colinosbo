<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c08"/>
      <stop offset="40%" stop-color="#021a10"/>
      <stop offset="100%" stop-color="#020c08"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB3"/>
      <stop offset="50%" stop-color="#afffec"/>
      <stop offset="100%" stop-color="#00FFB3"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020c08" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00FFB3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00FFB3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020c08" stop-opacity="0"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Grid lines horizontal -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>

  <!-- Grid lines vertical -->
  <line x1="150" y1="0" x2="150" y2="200" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="450" y1="0" x2="450" y2="200" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>
  <line x1="750" y1="0" x2="750" y2="200" stroke="#00FFB3" stroke-width="0.3" opacity="0.08"/>

  <!-- Corner brackets -->
  <path d="M20,20 L20,8 L32,8" fill="none" stroke="#00FFB3" stroke-width="1.5" opacity="0.7"/>
  <path d="M880,20 L880,8 L868,8" fill="none" stroke="#00FFB3" stroke-width="1.5" opacity="0.7"/>
  <path d="M20,180 L20,192 L32,192" fill="none" stroke="#00FFB3" stroke-width="1.5" opacity="0.7"/>
  <path d="M880,180 L880,192 L868,192" fill="none" stroke="#00FFB3" stroke-width="1.5" opacity="0.7"/>

  <!-- Decorative dots corners -->
  <circle cx="20" cy="20" r="2" fill="#00FFB3" opacity="0.5"/>
  <circle cx="880" cy="20" r="2" fill="#00FFB3" opacity="0.5"/>
  <circle cx="20" cy="180" r="2" fill="#00FFB3" opacity="0.5"/>
  <circle cx="880" cy="180" r="2" fill="#00FFB3" opacity="0.5"/>

  <!-- Small label top-left -->
  <text x="32" y="22" font-family="'Courier New', Courier, monospace" font-size="10" fill="#00FFB3" opacity="0.45" letter-spacing="2">[ COLINOSBO ]</text>

  <!-- Small label top-right -->
  <text x="868" y="22" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10" fill="#00FFB3" opacity="0.45" letter-spacing="2">SEC+</text>

  <!-- Divider line above title -->
  <rect x="50" y="62" width="800" height="0.5" fill="url(#lineGrad)"/>

  <!-- Main title -->
  <text x="450" y="110" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="54" font-weight="700" letter-spacing="6"
    fill="url(#titleGrad)" filter="url(#textGlow)">INFORMATION SECURITY</text>

  <!-- Divider line below title -->
  <rect x="50" y="140" width="800" height="0.5" fill="url(#lineGrad)"/>

  <!-- Subtitle name -->
  <text x="450" y="165" text-anchor="middle" dominant-baseline="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="16" font-weight="400" letter-spacing="8"
    fill="#ffffff" opacity="0.75" filter="url(#subtleGlow)">COLIN OSBORN</text>

</svg>
